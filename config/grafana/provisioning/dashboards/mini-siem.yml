# ============================================================
# Grafana - Dashboard Provisioning
# ============================================================
# Lädt das Mini-SIEM-Dashboard automatisch aus dem
# konfigurierten Dashboard-Verzeichnis.
# ============================================================

apiVersion: 1

providers:
  - name: Mini-SIEM
    orgId: 1
    folder: Mini-SIEM
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true

    options:
      path: /var/lib/grafana/dashboards