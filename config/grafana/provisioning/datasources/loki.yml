# ============================================================
# Grafana - Loki Data Source
# ============================================================
# Die Loki-Datenquelle wird beim Start von Grafana
# automatisch provisioniert.
# ============================================================

apiVersion: 1

datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://127.0.0.1:3100
    isDefault: true
    editable: false